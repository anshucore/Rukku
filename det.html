<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Detective Rukma - The Casebook</title>
    <link rel="icon" href="r.webp" type="image/webp">
    <style>
        :root {
            --bg: #f4efe4;
            --card: #fffdf7;
            --ink: #241f1a;
            --mu: #7a7164;
            --acc: #8b1e2d;
            --gold: #a87400;
            --line: #d8cfbd;
            --ok: #2f7d4f;
            --bad: #b3261e;
            --cell: 30px;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #12141c;
                --card: #1b1f2b;
                --ink: #ece6d8;
                --mu: #9b9585;
                --acc: #e05a6d;
                --gold: #e0b84a;
                --line: #33394a;
                --ok: #5fc08a;
                --bad: #ff7b72
            }
        }

        :root[data-theme="dark"] {
            --bg: #12141c;
            --card: #1b1f2b;
            --ink: #ece6d8;
            --mu: #9b9585;
            --acc: #e05a6d;
            --gold: #e0b84a;
            --line: #33394a;
            --ok: #5fc08a;
            --bad: #ff7b72
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 Georgia, 'Times New Roman', serif
        }

        #app {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px
        }

        h1,
        h2,
        h3 {
            margin: 0;
            font-family: Georgia, serif
        }

        h1 {
            font-size: 24px;
            color: var(--acc)
        }

        h2 {
            font-size: 22px;
            color: var(--acc)
        }

        .mu {
            color: var(--mu);
            font-size: 14px;
            margin: 2px 0
        }

        .hd {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .av {
            font-size: 40px
        }

        .sc {
            margin-left: auto;
            text-align: right
        }

        .sc b {
            display: block;
            font-size: 28px;
            color: var(--gold);
            line-height: 1
        }

        .sc span {
            font-size: 12px;
            color: var(--mu)
        }

        .bar {
            height: 8px;
            background: var(--line);
            border-radius: 4px;
            margin: 14px 0 4px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--acc)
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 8px;
            margin: 14px 0
        }

        .t {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            border-radius: 10px;
            padding: 8px 2px;
            text-align: center;
            font: inherit;
            cursor: pointer;
            min-height: 64px
        }

        .t b {
            display: block;
            font-size: 17px
        }

        .t small {
            display: block;
            font-size: 11px;
            color: var(--mu)
        }

        .t.lk {
            opacity: .5;
            cursor: not-allowed
        }

        .t.cur {
            border: 2px solid var(--acc)
        }

        .t.ok {
            border-color: var(--ok)
        }

        .t.ok small {
            color: var(--ok)
        }

        button {
            font: inherit
        }

        .btn {
            background: var(--acc);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold
        }

        .btn.sec {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line)
        }

        .lnk {
            background: none;
            border: 0;
            color: var(--mu);
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            margin: 12px 0
        }

        .top {
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            background: var(--bg);
            padding: 8px 0;
            z-index: 5;
            border-bottom: 1px solid var(--line)
        }

        #tm {
            margin-left: auto;
            font: bold 24px ui-monospace, Menlo, monospace
        }

        .g {
            color: var(--ok)
        }

        .y {
            color: var(--gold)
        }

        .r {
            color: var(--bad)
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .chip {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 14px;
            background: var(--bg)
        }

        ol.cl {
            padding-left: 22px;
            margin: 6px 0
        }

        ol.cl li {
            cursor: pointer;
            padding: 3px 0
        }

        ol.cl li.dn {
            text-decoration: line-through;
            opacity: .45
        }

        .gw {
            overflow-x: auto
        }

        table.gr {
            border-collapse: collapse;
            font: 13px Georgia, serif
        }

        .gr th {
            font-weight: normal;
            white-space: nowrap
        }

        .gr th.rl {
            text-align: right;
            padding-right: 6px
        }

        .gr th.cl {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-align: left;
            padding: 0 0 6px;
            height: 96px;
            vertical-align: bottom
        }

        .gr td {
            width: var(--cell);
            height: var(--cell);
            text-align: center;
            border: 1px solid var(--line);
            cursor: pointer;
            user-select: none;
            font-size: 17px;
            line-height: 1;
            padding: 0
        }

        .gr td.e {
            border: 0;
            cursor: default
        }

        .gr td.bl {
            border-left: 2px solid var(--ink)
        }

        .gr td.bt {
            border-top: 2px solid var(--ink)
        }

        .gr td.br {
            border-right: 2px solid var(--ink)
        }

        .gr td.bb {
            border-bottom: 2px solid var(--ink)
        }

        .gr td.o {
            color: var(--ok)
        }

        .gr td.x {
            color: var(--mu)
        }

        .opt {
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer
        }

        .opt.sel {
            background: var(--acc);
            color: #fff;
            border-color: var(--acc)
        }

        #msg {
            min-height: 22px;
            margin-top: 8px;
            font-weight: bold
        }

        .big {
            font-size: 44px;
            text-align: center
        }

        @media(max-width:520px) {
            :root {
                --cell: 26px
            }
        }
    </style>
</head>
