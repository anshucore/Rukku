<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rukku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211b16;
    --ivory:#f6efe3;
    --paper:#fbf7ef;
    --rose:#c17f70;
    --wine:#6f3733;
    --gold:#b99a63;
    --sage:#8b9a7a;
    --line: rgba(33,27,22,0.14);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }

  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,0.035) 1px, transparent 1px);
    background-size:3px 3px;
    z-index:1;
  }

  a{ color:inherit; }

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 6vw;
    background:rgba(246,239,227,0.88);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-family:'Cormorant Garamond', serif;
    font-size:1.5rem;
    letter-spacing:0.03em;
  }
  .logo em{ font-style:italic; color:var(--wine); }
  nav ul{
    list-style:none; display:flex; gap:34px;
  }
  nav a{
    text-decoration:none; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:0.14em;
    position:relative; padding-bottom:4px;
  }
  nav a::after{
    content:""; position:absolute; left:0; bottom:0;
    width:0; height:1px; background:var(--wine);
    transition:width .3s ease;
  }
  nav a:hover::after{ width:100%; }
  .nav-toggle{ display:none; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:78vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:120px 6vw 90px;
    overflow:hidden;
  }
  .hero-eyebrow{
    font-size:0.75rem; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--wine); margin-bottom:22px;
  }
  .hero h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:clamp(2.6rem, 7vw, 5.4rem);
    line-height:1.05;
    max-width:16ch;
  }
  .hero h1 em{
    font-style:italic; color:var(--rose);
  }
  .hero p{
    margin-top:26px;
    max-width:46ch;
    font-size:1.05rem;
    line-height:1.7;
    color:rgba(33,27,22,0.72);
  }
  
  
  /* ---------- GALLERY ---------- */
  .gallery-wrap{ padding:0 5vw 100px; position:relative; z-index:2; }
  .gallery{
    columns:4 260px;
    column-gap:34px;
  }
  @media (max-width:900px){ .gallery{ columns:2 240px; } }
  @media (max-width:520px){ .gallery{ columns:1; } }

  .card{
    break-inside:avoid;
    margin-bottom:34px;
    background:var(--paper);
    padding:14px 14px 20px;
    box-shadow:0 10px 26px rgba(33,27,22,0.10);
    transform:rotate(var(--r,-1.4deg));
    transition:transform .4s ease, box-shadow .4s ease;
    position:relative;
    cursor:default;
  }
  .card:nth-child(2n){ --r:1.6deg; }
  .card:nth-child(3n){ --r:-0.8deg; }
  .card:nth-child(4n){ --r:2.1deg; }
  .card:nth-child(5n){ --r:-2deg; }
  .card:hover{
    transform:rotate(0deg) translateY(-6px);
    box-shadow:0 22px 40px rgba(33,27,22,0.18);
    z-index:5;
  }

  .tape{
    position:absolute; top:-10px; left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:64px; height:22px;
    background:rgba(201,166,103,0.55);
    border:1px solid rgba(201,166,103,0.7);
  }

  .frame{
    aspect-ratio: var(--ar, 4/5);
    width:100%;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(135deg, #e7dcc7, #d8c6ab 40%, #cbb491 70%, #e2d3ba);
  }
  .frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;   /* shows the FULL photo, never crops */
    object-position:center;
  }
  .frame svg{
    position:absolute; inset:0; margin:auto;
    width:34%; height:34%; opacity:0.5;
  }
  .frame .ph-label{
    position:absolute; bottom:10px; left:10px; right:10px;
    font-size:0.62rem; letter-spacing:0.08em;
    color:rgba(33,27,22,0.55);
    font-family:'Jost',sans-serif;
    background:rgba(251,247,239,0.55);
    padding:3px 6px;
  }

  .caption{
    padding-top:14px;
    text-align:center;
  }
  .caption .title{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.15rem;
  }
  .caption .meta{
    margin-top:4px;
    font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(33,27,22,0.55);
  }

  .card[data-cat="golden"]{ display:block; }

  /* ---------- HOW TO USE (guide block, remove when done) ---------- */
  .howto{
    margin:0 6vw 90px;
    border:1px dashed var(--wine);
    background:rgba(111,55,51,0.05);
    padding:26px 30px;
    font-size:0.85rem;
    line-height:1.8;
    color:rgba(33,27,22,0.8);
  }
  .howto strong{ color:var(--wine); }
  .howto code{
    background:rgba(33,27,22,0.08);
    padding:1px 6px; border-radius:4px;
    font-size:0.8rem;
  }

  /* ---------- CTA ---------- */
  .cta{
    text-align:center;
    padding:100px 6vw 130px;
    border-top:1px solid var(--line);
  }
  .cta h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:500; font-style:italic;
    font-size:clamp(1.9rem, 4vw, 3rem);
    max-width:20ch; margin:0 auto 22px;
  }
  .cta p{
    max-width:44ch; margin:0 auto 34px;
    color:rgba(33,27,22,0.7); line-height:1.7;
  }
  .btn{
    display:inline-block;
    background:var(--wine); color:var(--paper);
    text-decoration:none;
    padding:16px 38px;
    font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase;
    border-radius:999px;
    transition:background .25s ease, transform .25s ease;
  }
  .btn:hover{ background:var(--ink); transform:translateY(-2px); }

  footer{
    padding:36px 6vw;
    display:flex; justify-content:space-between; align-items:center;
    border-top:1px solid var(--line);
    font-size:0.72rem; letter-spacing:0.06em;
    color:rgba(33,27,22,0.55);
  }
  @media (max-width:600px){
    footer{ flex-direction:column; gap:10px; text-align:center; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .btn, nav a::after{ transition:none; }
  }

    /* ---------- LIGHTBOX / PRESENTATION MODE ---------- */
    .frame img { cursor: zoom-in; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17, 13, 10, 0.94);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease;
      touch-action: none;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 90px;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      background: #14100c;
      opacity: 0;
      transform: scale(0.97);
      transition: opacity .25s ease, transform .25s ease;
    }

    .lightbox-img.show {
      opacity: 1;
      transform: scale(1);
    }

    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      background: rgba(246, 239, 227, 0.1);
      border: 1px solid rgba(246, 239, 227, 0.35);
      color: var(--ivory);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .lightbox-close:hover,
    .lightbox-nav:hover {
      background: rgba(246, 239, 227, 0.22);
    }

    .lightbox-close {
      top: 22px;
      right: 22px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.4rem;
      line-height: 1;
      z-index: 3;
    }

    .lightbox-nav {
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 1.6rem;
      z-index: 3;
    }

    .lightbox-nav:active {
      transform: translateY(-50%) scale(0.92);
    }

    .lightbox-prev { left: 18px; }
    .lightbox-next { right: 18px; }

    .lightbox-counter {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(246, 239, 227, 0.75);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      z-index: 3;
    }

    .lightbox-hint {
      position: absolute;
      top: 22px;
      left: 22px;
      color: rgba(246, 239, 227, 0.55);
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 3;
    }

    @media (max-width:700px) {
      .lightbox-stage { padding: 60px 16px; }
      .lightbox-nav { width: 42px; height: 42px; font-size: 1.3rem; }
      .lightbox-prev { left: 6px; }
      .lightbox-next { right: 6px; }
      .lightbox-hint { display: none; }
    }
  </style>

</head>

  <script>
    (function () {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const counterEl = document.getElementById('lightboxCounter');
      const btnClose = document.getElementById('lightboxClose');
      const btnPrev = document.getElementById('lightboxPrev');
      const btnNext = document.getElementById('lightboxNext');
      const grid = document.getElementById('galleryGrid');

      let currentIndex = 0;

      function showAt(index) {
        if (!PHOTOS.length) return;
        currentIndex = (index + PHOTOS.length) % PHOTOS.length;
        const photo = PHOTOS[currentIndex];
        lightboxImg.classList.remove('show');
        // brief fade for a smoother slide-to-slide feel
        setTimeout(() => {
          lightboxImg.src = photo.img;
          lightboxImg.alt = photo.title || photo.couple || '';
          lightboxImg.classList.add('show');
        }, 60);
        counterEl.textContent = (currentIndex + 1) + ' / ' + PHOTOS.length;
      }

      function open(index) {
        showAt(index);
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function close() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }

      function next() { showAt(currentIndex + 1); }
      function prev() { showAt(currentIndex - 1); }

      // Open on double-click of any photo in the grid (works even after re-render)
      grid.addEventListener('dblclick', function (e) {
        const img = e.target.closest('.frame img');
        if (!img) return;
        const index = PHOTOS.findIndex(p => p.img === img.getAttribute('src'));
        open(index === -1 ? 0 : index);
      });

      btnClose.addEventListener('click', close);
      btnNext.addEventListener('click', next);
      btnPrev.addEventListener('click', prev);

      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox || e.target.classList.contains('lightbox-stage')) close();
      });

      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowRight') next();
        else if (e.key === 'ArrowLeft') prev();
      });

      // Simple swipe support for touch devices
      let touchStartX = null;
      lightbox.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].clientX;
      }, { passive: true });
      lightbox.addEventListener('touchend', function (e) {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
        touchStartX = null;
      }, { passive: true });
    })();
  </script>

</body>

</html>
